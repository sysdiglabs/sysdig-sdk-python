            $ref: '#/components/schemas/Vulnerability'
          example:
            71af37c6a8f2772:
              name: CVE-2021-1234
              severity: high
              cvssScore:
                version: '3.0'
                score: 1
                vector: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
              disclosureDate: '2021-01-02'
              solutionDate: '2021-01-02'
              exploitable: true
