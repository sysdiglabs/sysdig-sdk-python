      headers:
        X-RateLimit-Limit:
          description: Maximum number of allowed requests per minute.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 4096
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: forbidden
            message: Forbidden
            details: []
    BadRequestPrometheus:
      description: Operation failed due to invalid payload.
      headers:
        X-RateLimit-Limit:
          description: Maximum number of allowed requests per minute.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 4096
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrometheusError'
          example:
            status: error
            errorType: bad_data
            error: 'unknown position: parse error: no expression found in input'
    UnauthorizedPrometheus:
      description: Access denied.
      headers:
        X-RateLimit-Limit:
          description: Maximum number of allowed requests per minute.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 4096
      content:
        application/json:
          schema:
            type: object
            properties:
              timestamp:
                type: integer
                format: int64
                description: Epoch timestamp (milliseconds) when the error occurred.
                minimum: 0
                maximum: 9999999999999
                example: 1743154268491
              status:
                type: integer
                format: int32
                description: HTTP status code of the response.
                enum:
                  - 401
                minimum: 401
                maximum: 401
                example: 401
              error:
                type: string
                description: A human-readable error message.
                maxLength: 1024
                example: Unauthorized
              path:
                type: string
                description: The requested endpoint path that triggered the error.
                maxLength: 1024
                example: /ext/auth/prometheus/api/v1/query
            required:
              - timestamp
              - status
              - error
              - path
    NotFoundPrometheus:
      description: Not found.
      headers:
        X-RateLimit-Limit:
          description: Maximum number of allowed requests per minute.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 4096
      content:
        application/json:
          schema:
            type: string
            description: Error message indicating that the requested page was not found.
            maxLength: 1024
            example: 404 page not found
    InternalServerErrorPrometheus:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrometheusError'
          example:
            status: error
            errorType: server_error
            error: error writing response
    UnprocessableEntityPrometheus:
      description: Operation failed due to unprocessable entity.
      headers:
        X-RateLimit-Limit:
          description: Maximum number of allowed requests per minute.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 4096
      content:
        application/json:
          schema:
