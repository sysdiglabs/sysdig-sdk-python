                - alpine:latest
        policies:
          $ref: '#/components/schemas/Policies'
        riskAccepts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RiskAcceptanceDefinition'
          example:
            e6b4b0d3255bfef:
              id: 550e8400-e29b
