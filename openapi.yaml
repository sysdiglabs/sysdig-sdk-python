          nullable: true
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/MonitorScopeLabel'
        scope:
          type: string
          description: Initial event scope
          maxLength: 50000
          example: kube_namespace_name = 'test'
