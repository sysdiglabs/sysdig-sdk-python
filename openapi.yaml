        - ROLLOUT_RESTART
        - KUBERNETES_VOLUME_SNAPSHOT
        - KUBERNETES_DELETE_VOLUME_SNAPSHOT
        - GET_LOGS
        - ISOLATE_NETWORK
        - DELETE_NETWORK_POLICY

        The following actions serve as the undo for previous actions:
        - START_CONTAINER: undo for STOP_CONTAINER\
        - UNPAUSE_CONTAINER: undo for PAUSE_CONTAINER\
        - FILE_UNQUARANTINE: undo for FILE_QUARANTINE\
        - KUBERNETES_DELETE_VOLUME_SNAPSHOT: undo for KUBERNETES_VOLUME_SNAPSHOT\
        - DELETE_NETWORK_POLICY: undo for ISOLATE_NETWORK\

        Do not use undo actions in [submitActionExecutionv1](#tag/Response-actions/operation/submitActionExecutionv1).

        You can execute an undo actions using the service [undoActionExecutionV1](#tag/Response-actions/operation/undoActionExecutionV1).
      type: string
      example: KILL_PROCESS
      maxLength: 64
    ResponderType:
      description: The type of Responder executing an action.
      type: string
      enum:
        - HOST
        - CLUSTER
        - CLOUD
      example: HOST
    ExecutionContext:
      description: |
        The context in which the Response Action is executed.\
        It may contain additional information on the Response Action being executed, such as the host name or the MAC address.\
        For example:\
        ```json
        {
            "host.hostName": "my-host",
            "host.mac": "00:00:00:00:00:00",
            "host.id": "abc123"
        }
        ```
      additionalProperties:
        type: string
        maxLength: 1024
    ActionExecutionStringParameterValue:
      type: string
      maxLength: 512
      description: The value of a string parameter.
      example: https://qa-automation-custom-bucket-foo-bar.a0.xx-yyy-3.baz.com/responseactions/121517/8745b945-7e47-4641-9ed6-1bf7088350e3/foo2?X-Amz-Algorithm=ABC1-DEFG-HIJ123&X-Ywz-Date=12345678T123456Z&X-Ywz-FooBarBaz=xxx&X-Zyx-Qwerty=12345&X-Ywz-FooBar=FOOBARFOOBAR%2F12345678%2Fxx-yyyy-3%2Fs3%2Fabc4_request&X-Xyz-Foobar=6bb3e135165186c148efee4b6c81866b39213b3476499a1f9e303e744f51c7e1
      pattern: ^[\x20-\x7E]*$
    ActionExecutionIntParameterValue:
      type: integer
      format: int64
      maximum: 9223372036854776000
      minimum: -9223372036854776000
      description: The value of an int parameter.
      example: -1
    ActionExecutionParameterValue:
      description: The value of a parameter.
      oneOf:
        - $ref: '#/components/schemas/ActionExecutionStringParameterValue'
        - $ref: '#/components/schemas/ActionExecutionIntParameterValue'
        - type: boolean
          description: The value of a boolean parameter.
          example: true
    ActionExecutionParameters:
      description: The parameters used to request the Response Action execution.
      additionalProperties:
        $ref: '#/components/schemas/ActionExecutionParameterValue'
    ActionExecutionOutputs:
      description: The parameters used to request the Response Action execution.
      additionalProperties:
        $ref: '#/components/schemas/ActionExecutionParameterValue'
    Failure:
      description: The reason a Response Action failed to execute.
      required:
        - failureReason
        - logMessage
      properties:
        failureReason:
          type: string
          description: The reason for the failure.
          example: forbidden
          maxLength: 64
        logMessage:
          type: string
          description: The log message of the action failure.
          example: Could not execute the action.
          maxLength: 1024
    ActionExecutionStatus:
      description: The status of the action execution.
      type: string
      enum:
        - ENQUEUED
        - IN_PROGRESS
        - COMPLETED
        - FAILED
      example: COMPLETED
    ActionExecution:
      description: The submitted Response Action.
      required:
        - id
        - actionType
        - responderType
        - executionContext
        - parameters
        - status
        - createdAt
      properties:
        id:
          type: string
          description: The ID of the Response Action.
          example: b137bf86-399f-43f7-8d2b-53060af4da9f
          maxLength: 64
        callerId:
          $ref: '#/components/schemas/CallerId'
        actionType:
          $ref: '#/components/schemas/ResponseActionType'
        responderType:
          $ref: '#/components/schemas/ResponderType'
        executionContext:
          $ref: '#/components/schemas/ExecutionContext'
        parameters:
          $ref: '#/components/schemas/ActionExecutionParameters'
        outputs:
          $ref: '#/components/schemas/ActionExecutionOutputs'
        failure:
          $ref: '#/components/schemas/Failure'
        status:
          $ref: '#/components/schemas/ActionExecutionStatus'
        userId:
          type: integer
          description: The ID of the user that submitted the Response Action.
          example: 1234
          format: int64
          minimum: 0
          maximum: 9223372036854776000
        createdAt:
          type: string
          format: date-time
          description: The date and time the Response Action was submitted.
          example: '2020-01-01T00:00:00Z'
          maxLength: 64
        updatedAt:
          type: string
          format: date-time
          description: The date and time the Response Action was last updated.
          example: '2020-01-01T00:00:00Z'
          maxLength: 64
        actionExecutionIdBeingUndone:
          type: string
          description: The ID of the Response Action being undone.
          example: b137bf86-399f-43f7-8d2b-53060af4da9f
          maxLength: 64
    ActionExecutions:
      description: A list of Response Action executions.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActionExecution'
          maxItems: 1000
          description: The list of Response Actions.
    SubmitActionExecutionRequest:
      description: The request for the execution of a Response Action.
      required:
        - actionType
        - parameters
      properties:
        actionType:
          $ref: '#/components/schemas/ResponseActionType'
        callerId:
          $ref: '#/components/schemas/CallerId'
        parameters:
          $ref: '#/components/schemas/ActionExecutionParameters'
    ActionParameterName:
      type: string
      maxLength: 200
      description: The name of the parameter.
      example: container.id
      pattern: ^[a-zA-Z\._]*$
    ParameterType:
      description: |
        The type of an Response Action parameter.\
        It may assume the following values:\
        * string\
        * integer\
        * boolean\
        This list of possible values may grow in the future.
      type: string
      example: integer
      maxLength: 20
    ActionParameterMetadata:
      description: Metadata that describes a parameter to be submitted for a Response Action execution.
      required:
        - name
        - description
        - type
        - required
      properties:
        name:
          $ref: '#/components/schemas/ActionParameterName'
        description:
          type: string
          maxLength: 1024
          description: The description of the parameter.
          example: A container id
        type:
          $ref: '#/components/schemas/ParameterType'
        required:
          type: boolean
          description: If `true`, the parameter is mandatory.
          example: true
    OutputParameterName:
      type: string
      maxLength: 200
      description: The name of the output parameter.
      example: quarantined_file_path
      pattern: ^[a-zA-Z\._]*$
    ActionOutputsMetadata:
      description: Metadata that describes a parameter returned by a Response Action execution.
      required:
        - name
        - description
        - type
        - required
      properties:
        name:
          $ref: '#/components/schemas/OutputParameterName'
        description:
          type: string
          maxLength: 1024
          description: The description of the output parameter.
          example: An absolute path
        type:
          $ref: '#/components/schemas/ParameterType'
        required:
          type: boolean
          description: If `true`, the parameter is mandatory.
          example: true
    ResponseAction:
      description: The action metadata
      required:
        - type
        - responderType
        - parameters
        - description
