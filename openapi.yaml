    BaseRiskAcceptedResponsePayload:
      type: object
      title: Base Response Accepted Risk Payload
      properties:
        id:
          type: string
          maxLength: 512
          description: The Accepted Risk ID
          example: 17af8bade67c9a208e632df001fcea2c
        expirationDate:
          description: Date when the accepted risk will expire (in YYYY-MM-DD format)
          type: string
          format: date
          maxLength: 10
          example: '2024-02-27'
        createdAt:
          type: string
          maxLength: 100
          format: date-time
          description: Date when the Accepted Risk was created
          example: '2024-01-22T08:51:46.016464Z'
        updatedAt:
          type: string
          maxLength: 100
          format: date-time
          description: Date when the Accepted Risk was updated
          example: '2024-02-22T08:51:46.016464Z'
        status:
          type: string
          description: Specifies whether the Accepted Risk is enabled or expired
          enum:
            - active
            - expired
          example: active
        createdBy:
          type: string
          maxLength: 100
          description: User who created the risk acceptance
          example: user@sysdig.com
        updatedBy:
          type: string
          maxLength: 100
          description: User who last updated the risk acceptance
          example: user@sysdig.com
    BaseRiskAcceptedPayload:
      type: object
      title: Base Accepted Risk Payload
      properties:
        entityValue:
          description: A value to match with the entityType
          type: string
          maxLength: 512
          minLength: 1
          example: CVE-1234-56789
        expirationDate:
          description: Date when the accepted risk will expire (in YYYY-MM-DD format)
          type: string
          format: date
          maxLength: 10
          example: '2024-02-27'
        reason:
          description: Reason for acceptance
          type: string
          enum:
            - RiskTransferred
            - RiskAvoided
            - RiskMitigated
            - RiskOwned
            - RiskNotRelevant
            - Custom
          example: RiskTransferred
        description:
          description: Description of why the accepted risk was created
          type: string
          maxLength: 512
          example: vulnerability cannot be removed manually
        stages:
          description: List of stages where the risk acceptance is applied, empty list enables risk acceptance for all the stages
          type: array
          minItems: 0
          maxItems: 3
          nullable: true
          items:
            type: string
            enum:
              - runtime
              - pipeline
              - registry
            example: runtime
          example:
            - runtime
            - pipeline
            - registry
    RiskAcceptedResponse:
      type: object
      title: Accepted Risk Response
      allOf:
        - type: object
          required:
            - id
            - entityType
            - entityValue
            - context
            - reason
            - description
            - status
          properties:
            entityType:
              type: string
              description: The entity where the Accepted Risk will be applied.
              enum:
                - imageName
                - imagePrefix
                - imageSuffix
                - vulnerability
                - hostName
                - hostNameContains
                - imageNameContains
                - policyRule
                - package
              example: imageName
            context:
              description: If entityType is not `vulnerability`, `policyRule` or `package`, you should use `Empty Matcher` in the context.
              oneOf:
                - $ref: '#/components/schemas/ContextEmpty'
                - $ref: '#/components/schemas/ContextImageName'
                - $ref: '#/components/schemas/ContextImageSuffix'
                - $ref: '#/components/schemas/ContextImagePrefix'
                - $ref: '#/components/schemas/ContextImageContains'
                - $ref: '#/components/schemas/ContextPackageName'
                - $ref: '#/components/schemas/ContextPackageNameVersion'
                - $ref: '#/components/schemas/ContextHostName'
                - $ref: '#/components/schemas/ContextHostContains'
                - $ref: '#/components/schemas/ContextPackagePath'
                - $ref: '#/components/schemas/ContextPackageVersion'
                - $ref: '#/components/schemas/ContextPackagePathVersion'
        - $ref: '#/components/schemas/BaseRiskAcceptedResponsePayload'
        - $ref: '#/components/schemas/BaseRiskAcceptedPayload'
      example:
        id: 17ac9f4b9fa70c801868930109997bbc
        entityType: imageName
        entityValue: alpine:3.16
        expirationDate: '2025-02-01'
        context: []
        reason: Custom
        description: My description
        status: active
        createdAt: '2024-01-22T08:51:46.016464Z'
        updatedAt: '2024-01-22T08:51:46.016464Z'
        createdBy: user@sysdig.com
        updatedBy: user@sysdig.com
    ListRiskAcceptedResponse:
      title: Accepted Risk Response List
      type: object
      required:
        - data
      allOf:
        - $ref: '#/components/schemas/OffsetPaginatedResponse'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              maxItems: 200
              description: List of Accepted Risks
              items:
                allOf:
                  - $ref: '#/components/schemas/RiskAcceptedResponse'
    CreateRiskAcceptedRequest:
      title: Accepted Risk Request
      type: object
      allOf:
        - type: object
          required:
            - entityType
            - entityValue
            - reason
            - description
            - context
          properties:
            entityType:
              type: string
              description: The entity where the Accepted Risk will be applied.
              enum:
                - imageName
                - imagePrefix
                - imageSuffix
                - vulnerability
                - hostName
                - hostNameContains
                - imageNameContains
                - policyRule
                - package
              example: imageName
            context:
              description: If entityType is not `vulnerability`, `policyRule` or `package`, you should use `Empty Matcher` in the context.
              oneOf:
                - $ref: '#/components/schemas/ContextEmpty'
                - $ref: '#/components/schemas/ContextImageName'
                - $ref: '#/components/schemas/ContextImageSuffix'
                - $ref: '#/components/schemas/ContextImagePrefix'
                - $ref: '#/components/schemas/ContextImageContains'
                - $ref: '#/components/schemas/ContextPackageName'
                - $ref: '#/components/schemas/ContextPackageNameVersion'
                - $ref: '#/components/schemas/ContextHostName'
                - $ref: '#/components/schemas/ContextHostContains'
                - $ref: '#/components/schemas/ContextPackagePath'
                - $ref: '#/components/schemas/ContextPackageVersion'
                - $ref: '#/components/schemas/ContextPackagePathVersion'
        - $ref: '#/components/schemas/BaseRiskAcceptedPayload'
      example:
        entityType: vulnerability
        entityValue: CVE-2023-39325
        expirationDate: '2025-02-01'
        context: []
        reason: RiskTransferred
        description: Accept Risk everywhere for CVE-2023-39325
    UpdateRiskAccepted:
      title: Update Risk Accepted
      type: object
      properties:
        expirationDate:
          description: |
            Date when the accepted risk expires. Setting this to null will make the accepted risk never expire.
          type: string
          maxLength: 10
          example: '2024-02-27'
          nullable: true
        reason:
          description: Reason for acceptance
          type: string
          enum:
            - RiskTransferred
            - RiskAvoided
            - RiskMitigated
            - RiskOwned
            - RiskNotRelevant
            - Custom
          example: RiskTransferred
        description:
          description: Description of why the accepted risk was created
          type: string
          maxLength: 512
          example: vulnerability cannot be removed manually
    ZoneScope:
      title: Zone Scope
      type: object
      required:
        - targetType
      properties:
        id:
          $ref: '#/components/schemas/UnlimitedLong'
        targetType:
          type: string
          format: string
          example: target
          maxLength: 512
          description: The target type of the Scope
        rules:
          type: string
          format: string
          example: clusterId in ( "test" )
          maxLength: 2048
          description: Scoping rules to be applied
    ZoneResponseV1:
      title: Zone Response V1
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UnlimitedLong'
        name:
          type: string
          example: Production
          maxLength: 512
          description: The name of the Zone
        description:
          type: string
          format: string
          example: Production Environment
          maxLength: 8192
          description: The description of the Zone
        author:
          type: string
          format: string
          example: Sysdig
          maxLength: 512
          description: Email of the user who created this Zone
        lastModifiedBy:
          type: string
          format: string
          example: john_doe@sysdig.com
          maxLength: 512
          description: Email of the user who last modified the Zone
        lastUpdated:
          allOf:
            - $ref: '#/components/schemas/UnlimitedLong'
          description: |
            Timestamp indicating the moment the Zone has been last updated.\
            It is expressed in milliseconds elapsed since January 1, 1970 UTC.
        isSystem:
          type: boolean
          example: false
          description: Boolean value indicating if the Zone is a *System* one
        scopes:
          type: array
          maxItems: 8192
          items:
            $ref: '#/components/schemas/ZoneScope'
          description: Attached Zone Scopes
    ListZonesResponseV1:
      title: Zones List Response V1
      allOf:
        - $ref: '#/components/schemas/OffsetPaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              maxItems: 200
              items:
                allOf:
                  - $ref: '#/components/schemas/ZoneResponseV1'
                description: A paged list of Zones
    CreateZoneScopeRequestV1:
      title: Zone Scope
      type: object
      required:
        - targetType
      properties:
        targetType:
          type: string
          format: string
          example: aws
          maxLength: 512
          description: The target type of the Scope
        rules:
          type: string
          format: string
          example: clusterId in ( "test" )
          maxLength: 2048
          description: Scoping rules to be applied
    CreateZoneRequestV1:
      type: object
      title: Zone Request V1
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          example: Production
          maxLength: 255
          description: The name of the Zone. It must be unique
        description:
          type: string
          format: string
          example: Production environment
          maxLength: 1024
          description: The Zone description. It can be useful for adding extra information
        scopes:
          type: array
          minItems: 1
          maxItems: 512
          items:
            $ref: '#/components/schemas/CreateZoneScopeRequestV1'
          description: Zone attached scopes
