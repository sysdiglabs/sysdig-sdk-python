          description: Specifies if server-side encryption with provided encryption key (SSE-C) is enabled.
          type: boolean
          example: false
        buckets:
          type: array
          maxItems: 1
          nullable: true
          description: |
            The list of buckets where the captures are stored. Currently only one bucket is supported.
