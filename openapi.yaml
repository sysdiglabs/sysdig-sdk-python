          description: The unit pricing configuration used to compute costs.
          allOf:
            - $ref: '#/components/schemas/UnitPricingV1'
        spotLabel:
          description: The name of a node label that is used to identify the node as a spot node.
          type: string
          maxLength: 256
          nullable: true
