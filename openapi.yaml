    From:
      description: |
        From, expressed in Unix nanoseconds timestamp. The difference between `from` and `to`
        cannot be greater than 2 weeks.
        If defined, `cursor` cannot be used.
      type: integer
      format: int64
      minimum: 0
      example: 1546300800000000000
      maximum: 9223372036854776000
    To:
      description: |
        To, expressed in Unix nanoseconds timestamp. The difference between `from` and `to` cannot be greater than 2 weeks.
        If defined, `cursor` cannot be used.
      type: integer
      format: int64
      minimum: 0
      example: 1546300800000000000
      maximum: 9223372036854776000
    Cursor:
      description: |
        Cursor is a string used to retrieve paginated data. It acts as a pointer to the next page of data. When a cursor is defined, the `from` and `to` parameters must not be used.
      type: string
      example: LTltNGUybXIwdWkzZThhMjE1bjRn
      maxLength: 512
    AuditEventsFeedFilter:
      description: |
        Query language expression for filtering results.
        The filter is the result of logical concatenations,
        using "and" and "or" binary operators and the "not" unary prefix operator (i.e. `auditTrail.requestMethod = 'GET' and auditTrail.entityType = 'user'`),
        of attribute comparisons. Attribute comparisons can be:
        - scalar, using `=`, `!=` comparison operators (i.e. `auditTrail.teamName = 'Test team'`)
      type: string
      example: auditTrail.requestMethod = 'GET' and auditTrail.entityType = 'user'
      maxLength: 2048
    AuditEventsFeedLimit:
      description: The number of items to return
      type: integer
      format: int32
      minimum: 1
      maximum: 999
      default: 100
      example: 50
    AuditPage:
      type: object
      description: Pagination information.
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: |
            The number of events matching the search criteria. This number is always major or equal to the number of events returned.
          example: 10
          minimum: 0
          maximum: 9223372036854776000
        prev:
          type: string
          description: |
            `prev` is a string pointing to the previous page of data.
            Use this as the `cursor` to get the previous page of data.
          example: LTltNGUybXIwdWkzZThhMjE1bjRn
          maxLength: 512
        next:
          type: string
          description: "`next` is a string pointing to the next page of data.\nUse this as the `cursor` to scroll paginated results and get the next page of data. \nIf not included, the current response is the last page.\n"
          example: KzltNGUybXIwdWkzZThhMjE1bjRn
          maxLength: 512
    AuditTrailContent:
      description: Content object for Platform Audit Event.
      properties:
