              type: string
              maxLength: 256
              example: 'Could not perform cri-o command: could not get pid for container 9566c6966932'
    ContainerKilledAction:
      title: Container killed
      description: Container kill automatic action.
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - type: object
          properties:
            isSuccessful:
              type: boolean
              description: Whether or not the action was completed successfully.
              example: true
            errMsg:
              description: |
                When `isSuccessful` is `false`, details on why the action failed.
              type: string
              maxLength: 256
              example: 'Could not perform cri-o command: could not get pid for container 9566c6966932'
    DriftPreventedAction:
      title: Drift prevented
      description: Automatic action preventing the execution of a file not present in the original container image.
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - type: object
          properties:
            isSuccessful:
              type: boolean
              description: Whether or not the action was completed successfully.
              example: true
            errMsg:
              description: |
                When `isSuccessful` is `false`, details on why the action failed.
              type: string
              maxLength: 256
              example: 'Prevention action failed on container 9566c6966932 due to a system error: ...'
    MalwarePreventedAction:
      title: Malware prevented
      description: Malware execution prevention
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - type: object
          properties:
            isSuccessful:
              type: boolean
              description: Whether or not the action was completed successfully.
              example: true
            errMsg:
              description: |
                When `isSuccessful` is `false`, details on why the action failed.
              type: string
              maxLength: 256
              example: 'Prevention action failed on container 9566c6966932 due to a system error: ...'
    ProcessKilledAction:
      title: Process killed
      description: Process kill automatic action.
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - type: object
          properties:
            isSuccessful:
              type: boolean
              description: Whether or not the action was completed successfully.
              example: true
            errMsg:
              description: |
                When `isSuccessful` is `false`, details on why the action failed.
              type: string
              maxLength: 256
              example: Rule with name non_existent refers to a rule that does not exist
    Action:
      description: Action performed when the event happened.
      oneOf:
        - $ref: '#/components/schemas/CaptureAction'
        - $ref: '#/components/schemas/ContainerPausedAction'
        - $ref: '#/components/schemas/ContainerStoppedAction'
        - $ref: '#/components/schemas/ContainerKilledAction'
        - $ref: '#/components/schemas/DriftPreventedAction'
        - $ref: '#/components/schemas/MalwarePreventedAction'
        - $ref: '#/components/schemas/ProcessKilledAction'
      discriminator:
        propertyName: type
        mapping:
          capture: '#/components/schemas/CaptureAction'
          container_paused: '#/components/schemas/ContainerPausedAction'
          container_stopped: '#/components/schemas/ContainerStoppedAction'
          container_killed: '#/components/schemas/ContainerKilledAction'
          drift_prevented: '#/components/schemas/DriftPreventedAction'
          malware_prevented: '#/components/schemas/MalwarePreventedAction'
          process_killed: '#/components/schemas/ProcessKilledAction'
    EventContentType:
      type: string
      description: The type of the event content.
      enum:
        - workloadRuntimeDetection
        - workloadMLRuntimeDetection
        - agentlessMLRuntimeDetection
        - k8sAdmissionReview
        - agentlessRuntimeDetection
        - statefulDetections
      example: workloadRuntimeDetection
    BaseContent:
      description: Base content for all events
      type: object
      properties:
        type:
          $ref: '#/components/schemas/EventContentType'
      required:
        - type
    Zone:
      type: object
      description: A collection of scopes representing business areas.
      properties:
        zoneName:
          type: string
          description: Zone name
          example: Zone example
          maxLength: 256
        zoneId:
          $ref: '#/components/schemas/ZoneId'
      required:
        - zoneName
    ArbitraryMapOfStrings:
      type: object
      description: Key value pairs of values.
      additionalProperties:
        type: string
        maxLength: 256
        example: foo:bar
      example:
        foo: bar
        baz: qux
    K8sAdmissionReviewContent:
      description: Kubernetes admission requests-posture checks event content
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          properties:
            namespace:
              type: string
              example: hub
              description: Kubernetes namespace
              maxLength: 253
            clusterName:
              type: string
              example: prod5
              description: Kubernetes cluster name
              maxLength: 256
            resourceName:
              type: string
              example: sfdc-bulk-updates-12345678
              description: Kubernetes resource name
              maxLength: 253
            resourceKind:
              type: string
              example: Job
              description: Kubernetes resource kind
              maxLength: 63
            zones:
              type: array
              items:
                $ref: '#/components/schemas/Zone'
              maxItems: 1000
              description: List of zones that match the scope of the resource.
            scanResult:
              allOf:
                - $ref: '#/components/schemas/ArbitraryMapOfStrings'
                - description: Scan result
          required:
            - scanResult
    RuleName:
      type: string
      description: Name of the rule the event is generated after
      example: Create Security Group Rule Allowing SSH Ingress
      maxLength: 1024
    RuleType:
      type: integer
      format: int32
      description: |
        Rule type:
        - 1 - List matching - process
        - 2 - List matching - container
        - 3 - List matching - file
        - 4 - List matching - network
        - 5 - List matching - syscall
        - 6 - Falco
        - 7 - Drift detection
        - 8 - Malware detection
        - 11 - ML - Cryptominer detection
        - 13 - ML - AWS anomalous login
        - 14 - ML - Okta anomalous login
      example: 6
      maximum: 14
      minimum: 1
    RuleTags:
      type: array
      description: The tags attached to the rule
      items:
        type: string
        example: AWS_IAM
        maxLength: 64
      maxItems: 1000
    PolicyId:
      type: integer
      format: int64
      description: ID of the policy that generated the event
      example: 2
      maximum: 9223372036854776000
      minimum: 1
    PolicyOrigin:
      type: string
      example: Sysdig
      enum:
        - Sysdig
        - Secure UI
        - Tuner
      description: |
        The policy author:
        - `Sysdig` - default and managed policies
        - `Sysdig UI` - users interacting with Sysdig
        - `Tuner` - the automated tuner
    PolicyNotificationChannelIds:
      type: array
      description: |
        The list of notification channels where an alert is sent after event is generated.
        Doesn't account for aggregations and eventual thresholds.
      items:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854776000
        example: 123
        description: The id of the notification channel
      maxItems: 100
    AgentlessRuntimeDetectionContent:
      description: Agentless CDR event content
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          properties:
            integrationId:
              type: string
              example: 2U98T7RVNpAfveU6t9U6JoKVuZb
              maxLength: 32
              description: The unique identifier of the integration that generated the event.
            integrationType:
              type: string
              example: cloudtrail
              description: The type of integration that generated the event.
              enum:
                - cloudtrail
                - okta
                - github
                - gcp
                - azure
            ruleName:
              $ref: '#/components/schemas/RuleName'
            ruleType:
              $ref: '#/components/schemas/RuleType'
            ruleTags:
              $ref: '#/components/schemas/RuleTags'
            policyId:
              $ref: '#/components/schemas/PolicyId'
            policyOrigin:
              $ref: '#/components/schemas/PolicyOrigin'
            policyNotificationChannelIds:
              $ref: '#/components/schemas/PolicyNotificationChannelIds'
            priority:
              description: Rule priority
              type: string
              enum:
                - emergency
                - alert
                - critical
                - error
                - warning
                - informational
                - notice
                - debug
              example: error
            output:
              type: string
              description: Event output, generated after the configured rule
              example: Error Detected creation of security group rule allowing SSH ingress (requesting user=github-actions-ansible-molecule-role, requesting IP=1.2.3.4, account ID=123456789012, AWS region=us-east-1, arn=arn:aws:sts::0123456789012:assumed-role/github-actions-ansible-molecule-role/GitHubActions, security group=sg-121364e586677869e)
              maxLength: 2048
            fields:
              allOf:
                - description: List of fields populated based on the engine defaults, the rule output and the configuration
                - $ref: '#/components/schemas/ArbitraryMapOfStrings'
          required:
            - integrationId
            - integrationType
            - ruleName
            - ruleType
            - policyId
            - policyType
            - policyOrigin
    RuleSubType:
      type: integer
      format: int32
      description: |
        Rule subtype:
        - 1 - List matching - network - inbound
        - 2 - List matching - network - outbound
        - 3 - List matching - network - listening
        - 4 - List matching - file - readwrite
        - 5 - List matching - file - read only
      example: 1
      minimum: 1
      maximum: 5
    WorkloadRuntimeDetectionContent:
      description: Policy Event
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          properties:
            policyId:
              $ref: '#/components/schemas/PolicyId'
            ruleName:
              $ref: '#/components/schemas/RuleName'
            ruleType:
              $ref: '#/components/schemas/RuleType'
            ruleSubType:
              $ref: '#/components/schemas/RuleSubType'
            ruleTags:
              $ref: '#/components/schemas/RuleTags'
            output:
              type: string
              description: Event output, generated after the configured rule
              example: |
                File below a known binary directory opened for writing...
              maxLength: 2048
            fields:
              allOf:
                - $ref: '#/components/schemas/ArbitraryMapOfStrings'
                - description: List of fields populated based on the engine defaults, the rule output and the configuration
            runBook:
              type: string
              description: The runbook URL as configured in the policy.
              example: https://www.mycompany.com/our-runbook-link
              maxLength: 2048
            origin:
              $ref: '#/components/schemas/PolicyOrigin'
          required:
            - policyId
            - ruleName
            - ruleType
            - ruleSubType
            - ruleTags
            - output
            - fields
    WorkloadMlRuntimeDetectionContent:
      description: Workload ML event content
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          required:
            - command
            - exe
            - detectedClassProbability
            - policyId
          properties:
            command:
              type: string
              description: The command name
              example: bash
              maxLength: 1024
            exe:
              type: string
              description: The command path
              example: /bin/bash
              maxLength: 1024
            detectedClassProbability:
              type: number
              format: float
              description: The detected class probability (confidence score)
              minimum: 0
              maximum: 1
              example: 0.8
            policyId:
              $ref: '#/components/schemas/PolicyId'
    AgentlessMlRuntimeDetectionContent:
      description: Agentless ML event content
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          properties:
            policyId:
              $ref: '#/components/schemas/PolicyId'
            policyOrigin:
              $ref: '#/components/schemas/PolicyOrigin'
            policyNotificationChannelIds:
              $ref: '#/components/schemas/PolicyNotificationChannelIds'
            ruleName:
              $ref: '#/components/schemas/RuleName'
            ruleType:
              $ref: '#/components/schemas/RuleType'
            fields:
              allOf:
                - $ref: '#/components/schemas/ArbitraryMapOfStrings'
                - description: |
                    The fields of the event. The fields are specific to the event type.
                    The fields are arbitrary and are meant to be used for the event type.
          required:
            - policyOrigin
            - ruleName
            - ruleType
            - fields
    Stats:
      type: array
      description: |
        An array representing the relevant APIs and how often they were called in the time window.
      items:
        type: object
        properties:
          api:
            type: string
            example: DescribeInternetGateways
            maxLength: 64
          count:
            type: integer
            format: int32
            example: 1
            minimum: 1
            maximum: 2147483647
      maxItems: 1000
    Sequence:
      type: object
      description: |
        The sequence of events that occurred to trigger the event.
        The sequence is represented as a list of events, where each event is a map of key-value pairs.
      items:
        type: object
        properties:
          eventId:
            type: string
            description: The unique identifier of the log event.
            example: 9aca10ca-481a-4ab7-b8fa-929c1ebf4c18
            maxLength: 36
          eventName:
            type: string
            description: The name of the event.
            example: CreateUser
            maxLength: 64
          eventTime:
            type: string
            format: date-time
            description: The time when the event occurred.
            example: '2024-08-11T23:48:40Z'
            maxLength: 64
          ingestionId:
            type: string
            description: The unique identifier of the ingestion.
            example: '41157131027'
            maxLength: 32
          region:
            type: string
            description: The region where the event occurred.
            example: us-east-1
            maxLength: 64
          source:
            type: string
            description: The source of the event.
            example: aws
            maxLength: 64
          sourceIpAddress:
            type: string
            description: The IP address of the source.
            example: 1.1.1.1
            maxLength: 64
          subIngestionId:
            type: string
            description: The unique identifier of the sub ingestion.
            example: us-east-1
            maxLength: 32
        required:
          - eventId
          - eventName
          - eventTime
          - ingestionId
          - region
          - source
          - sourceIpAddress
          - subIngestionId
    StatefulDetectionsContent:
      description: |
        Stateful detections event content
      allOf:
        - $ref: '#/components/schemas/BaseContent'
        - type: object
          properties:
            ruleName:
              $ref: '#/components/schemas/RuleName'
            ruleType:
              $ref: '#/components/schemas/RuleType'
            ruleTags:
              $ref: '#/components/schemas/RuleTags'
            policyId:
              $ref: '#/components/schemas/PolicyId'
            policyOrigin:
              $ref: '#/components/schemas/PolicyOrigin'
            policyNotificationChannelIds:
              $ref: '#/components/schemas/PolicyNotificationChannelIds'
            output:
              type: string
              description: Event output, generated after the configured rule
              example: ''
              maxLength: 2048
            stats:
              $ref: '#/components/schemas/Stats'
            sequence:
              $ref: '#/components/schemas/Sequence'
            fields:
              allOf:
                - description: List of fields populated based on the engine defaults, the rule output and the configuration
                - $ref: '#/components/schemas/ArbitraryMapOfStrings'
          required:
            - ruleName
            - ruleType
            - policyId
            - policyOrigin
            - policyNotificationChannelIds
            - output
            - fields
            - ruleTags
    EventContent:
      type: object
      description: |
        Event data. It contains fields from the original event and attributes generated at the engine level.
      oneOf:
        - $ref: '#/components/schemas/K8sAdmissionReviewContent'
        - $ref: '#/components/schemas/AgentlessRuntimeDetectionContent'
        - $ref: '#/components/schemas/WorkloadRuntimeDetectionContent'
        - $ref: '#/components/schemas/WorkloadMlRuntimeDetectionContent'
        - $ref: '#/components/schemas/AgentlessMlRuntimeDetectionContent'
        - $ref: '#/components/schemas/StatefulDetectionsContent'
      discriminator:
        propertyName: type
        mapping:
          k8sAdmissionReview: '#/components/schemas/K8sAdmissionReviewContent'
          agentlessRuntimeDetection: '#/components/schemas/AgentlessRuntimeDetectionContent'
          workloadRuntimeDetection: '#/components/schemas/WorkloadRuntimeDetectionContent'
          workloadMLRuntimeDetection: '#/components/schemas/WorkloadMlRuntimeDetectionContent'
          agentlessMLRuntimeDetection: '#/components/schemas/AgentlessMlRuntimeDetectionContent'
          statefulDetections: '#/components/schemas/StatefulDetectionsContent'
    Event:
      description: Event feed
      required:
        - id
        - timestamp
        - originator
        - source
        - category
        - name
        - description
        - severity
        - contentType
      properties:
        id:
          type: string
          description: The event id.
          example: 15cbf54e34df95404caad1c988cf7c42
          maxLength: 32
        cursor:
          type: string
          description: |
            The cursor that can be used to fetch a set of events surrounding
            this same event. By providing this value as `cursor` in a GET
            `secureEvents` request, you will get the set of events surrounding
            this current event.
          example: LTltNGUybXIwdWkzZThhMjE1bjRn
          maxLength: 64
        timestamp:
          type: integer
          format: int64
          description: The event timestamp in nanoseconds.
          example: 1617220000000000000
          maximum: 9223372036854776000
          minimum: 0
        originator:
          $ref: '#/components/schemas/Originator'
        category:
          $ref: '#/components/schemas/Category'
        source:
          $ref: '#/components/schemas/Source'
        sourceDetails:
          $ref: '#/components/schemas/SourceDetails'
        rawEventOriginator:
          $ref: '#/components/schemas/RawEventOriginator'
        rawEventCategory:
          $ref: '#/components/schemas/RawEventCategory'
        engine:
          $ref: '#/components/schemas/Engine'
        name:
          type: string
          description: Name of the policy the event is generated after.
          example: Launch Privileged Container
          maxLength: 64
        description:
          type: string
          description: Description of the policy the event is generated after.
          example: |
            Identify a container being created with privileged=true
          maxLength: 1024
        severity:
          type: integer
          format: int32
          description: |
            The policy severity:
            - `0-3` - High
            - `4-5` - Medium
            - `6` - Low
            - `7` - Info
          minimum: 0
          maximum: 7
          example: 4
        actions:
          description: actions that have been triggered by the event
          type: array
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 1000
        content:
          $ref: '#/components/schemas/EventContent'
        labels:
          $ref: '#/components/schemas/ArbitraryMapOfStrings'
    ListEventsResponse:
      type: object
      description: The list of events matching a search criteria.
      required:
        - page
        - data
      properties:
        page:
          $ref: '#/components/schemas/EventsFeedPage'
        data:
          description: The list of events
          type: array
          items:
            $ref: '#/components/schemas/Event'
          maxItems: 20000
    SupportedFilter:
      type: object
      description: A supported field for filtering events.
      properties:
        id:
          type: string
          description: Attribute onto which filtering is supported.
          example: container.image.id
          maxLength: 64
        type:
          $ref: '#/components/schemas/SupportedFilterType'
        operands:
          type: array
          items:
            $ref: '#/components/schemas/Operand'
          description: The list of supported operands for filtering events.
          maxItems: 10
          minItems: 0
          uniqueItems: true
      required:
        - id
        - type
    SupportedFiltersResponse:
      type: object
      description: The list of supported attributes for filtering events.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportedFilter'
          description: The list of supported attributes for filtering events.
          maxItems: 1000
      required:
        - data
    IntegrationType:
      type: string
      description: The platform to which data will be forwarded
      enum:
        - SYSLOG
        - SPLUNK
        - MCM
        - QRADAR
        - WEBHOOK
        - KAFKA
        - CHRONICLE
        - SENTINEL
        - SQS
        - PUBSUB
        - SCC
        - ELASTIC
      example: SYSLOG
    IntegrationTypesResponse:
      type: object
      title: Integration types
      description: The list of supported integration types
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/IntegrationType'
    IntegrationChannel:
      type: string
      description: Type of data to forward
      enum:
        - SECURE_EVENTS_POLICIES
        - ACTIVITY_AUDIT
        - MONITOR_EVENTS
        - PLATFORM_AUDIT
      example: ACTIVITY_AUDIT
    IntegrationChannels:
      type: array
      description: Data types to forward. Must be compatible with the specified Integration type
      maxItems: 32
      items:
        $ref: '#/components/schemas/IntegrationChannel'
      example:
        - SECURE_EVENTS_POLICIES
        - ACTIVITY_AUDIT
    IntegrationChannelsResponse:
      type: object
      title: List Integrations Channels V1
      description: Integration Channels Response
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/IntegrationChannels'
    BaseIntegrationPayload:
      type: object
      title: Integration
      required:
        - name
        - type
      properties:
        name:
          description: A descriptive name to give to the integration
          type: string
          maxLength: 512
          example: name
        isEnabled:
          description: If the forwarding should be enabled or not
          type: boolean
          default: true
          example: true
        type:
          $ref: '#/components/schemas/IntegrationType'
        channels:
          $ref: '#/components/schemas/IntegrationChannels'
    KeyValueObject:
      type: object
      title: Key-value object representation
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: The key
          maxLength: 512
          example: mykey
        value:
          type: string
          description: The value
          maxLength: 512
          example: myvalue
    BaseConnectionInfoAmazonSqs:
      type: object
      title: Amazon SQS
      required:
        - region
        - queue
      properties:
        ownerAccount:
          type: string
          description: The AWS account ID of the account that created the queue
          maxLength: 256
          example: '123456789012'
        region:
          type: string
          description: Region in which the SQS queue is hosted
          maxLength: 16
          example: us-east
        queue:
          type: string
          description: Queue name
          maxLength: 16
          example: sysdig-efo-queue
        delay:
          type: integer
          description: Delay, in seconds, applied to the data
          format: int64
          minimum: 0
          maximum: 9223372036854776000
          example: 1
        headers:
          type: array
          description: 'Extra headers to add to the payload. Each header mapping requires 2 keys: ''key'' for the header key and ''value'' for its value'
          maxItems: 256
          items:
            $ref: '#/components/schemas/KeyValueObject'
    GetAmazonSqsIntegrationResponse:
      description: Get Amazon SQS Integration Response
      allOf:
        - $ref: '#/components/schemas/BaseIntegrationPayload'
        - type: object
          required:
            - id
            - name
            - isEnabled
            - type
            - channels
            - connectionInfo
          properties:
            id:
              type: integer
              format: int64
              description: The ID of the integration
              minimum: 1
              maximum: 9223372036854776000
              example: 1
            connectionInfo:
              $ref: '#/components/schemas/BaseConnectionInfoAmazonSqs'
    BaseConnectionInfoChronicle:
      type: object
      title: Google Chronicle
      properties:
        region:
          type: string
          description: The target region
          enum:
            - us
            - europe
            - asia-southeast1
          default: us
          example: europe
    BaseConnectionInfoChronicleV2:
      type: object
      title: Google Chronicle V2
      properties:
        region:
          type: string
          description: The target region
          enum:
            - us
            - europe
            - europe-west2
            - europe-west3
            - europe-west6
            - asia-southeast1
            - asia-south1
            - asia-northeast1
            - me-west1
            - me-central2
            - australia-southeast1
          default: us
          example: europe
        chronicleCustomerId:
          type: string
          description: Unique identifier (UUID) corresponding to a particular Chronicle instance
          example: 12345678-1234-1234-1234-123456789012
          maxLength: 64
        namespace:
          type: string
          description: User-configured environment namespace to identify the data domain the logs originated from
          example: test
          maxLength: 64
      required:
        - chronicleCustomerId
        - namespace
    GetChronicleIntegrationResponse:
      description: Get Google Chronicle Integration Response
      allOf:
        - $ref: '#/components/schemas/BaseIntegrationPayload'
        - type: object
          required:
            - id
            - name
            - isEnabled
            - type
            - channels
            - connectionInfo
          properties:
            id:
              type: integer
              format: int64
              description: The ID of the integration
              minimum: 1
              maximum: 9223372036854776000
              example: 1
            connectionInfo:
              oneOf:
                - $ref: '#/components/schemas/BaseConnectionInfoChronicle'
                - $ref: '#/components/schemas/BaseConnectionInfoChronicleV2'
    BaseConnectionInfoElasticsearch:
      type: object
      title: Connection Info Elasticsearch
      required:
        - endpoint
        - index
      properties:
        endpoint:
          type: string
          description: Elasticsearch instance endpoint URL
          maxLength: 256
          example: https://elastic.mydomain.com
        index:
          type: string
          description: Name of the index to store the data in
          maxLength: 256
          example: main
        isInsecure:
          type: boolean
          description: Don't verify TLS certificate
          default: false
          example: false
        auth:
          type: string
          description: Authentication method
          enum:
            - BASIC_AUTH
            - BEARER_TOKEN
          example: BASIC_AUTH
        format:
          type: string
