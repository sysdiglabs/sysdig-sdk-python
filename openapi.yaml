      properties:
        status:
          description: Request status.
          type: string
          enum:
            - success
            - error
          example: success
        data:
          type: object
          description: Response payload containing rule groups.
          properties:
            groups:
              type: array
              description: List of rule groups.
              items:
                type: object
                required:
                  - name
                  - file
                  - rules
                  - interval
                properties:
                  name:
                    type: string
                    maxLength: 255
                    description: Name of the rule group.
                    example: HTTP Alerts
                  interval:
                    type: string
                    maxLength: 30
                    description: Evaluation interval of the rule group.
                    example: 30s
                  rules:
                    type: array
                    description: List of rules in the group.
                    items:
                      type: object
                      required:
                        - type
                        - name
                        - query
                        - health
                      properties:
                        type:
                          type: string
                          enum:
                            - alerting
                            - recording
                          description: Type of rule (alerting or recording).
                          example: alerting
                        name:
                          type: string
                          maxLength: 255
                          description: Name of the rule.
                          example: HighCPUUsage
                        query:
                          type: string
                          maxLength: 5000
                          description: PromQL query associated with the rule.
                          example: avg by(instance) (rate(cpu_usage[5m])) > 0.9
                        duration:
                          type: string
                          maxLength: 30
                          description: Duration for which the rule must be active before triggering.
                          example: 5m
                        labels:
                          type: object
                          description: Labels assigned to the rule.
                          additionalProperties:
                            type: string
                            maxLength: 255
                            example: critical
                          example:
                            severity: critical
                        annotations:
                          type: object
                          description: Annotations providing additional information about the rule.
                          additionalProperties:
                            type: string
                            maxLength: 1024
                            example: CPU usage is high
                          example:
                            description: CPU usage is above 90% for more than 5 minutes.
                        alerts:
                          type: array
                          description: List of active alerts for this rule (only for alerting rules).
                          items:
                            type: object
                            required:
                              - state
                              - activeAt
                              - value
                            properties:
                              state:
                                type: string
                                enum:
                                  - pending
                                  - firing
                                description: Current state of the alert.
                                example: firing
                              activeAt:
                                type: string
                                format: date-time
                                maxLength: 30
                                description: Timestamp when the alert became active.
                                example: '2023-10-05T14:30:00Z'
                              value:
                                type: string
                                maxLength: 20
                                description: The numerical value that triggered the alert.
                                example: '1e+00'
          additionalProperties: false
        warnings:
          description: A set of warning messages attached to the response.
          type: array
          items:
            type: string
            example: ''
          example: []
        infos:
          description: A set of information messages attached to the response.
          type: array
          items:
            type: string
            example: ''
          example: []
