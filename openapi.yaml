        The request to save group mapping settings.
        Currently settings for conflict resolution strategies are supported.
      properties:
        noMappingStrategy:
          description: |
            Strategy for handling no mappings.
          type: string
          example: UNAUTHORIZED
          enum:
            - UNAUTHORIZED
            - DEFAULT_TEAM_DEFAULT_ROLE
            - NO_MAPPINGS_ERROR_REDIRECT
        differentRolesSameTeamStrategy:
          description: |
            Strategy for handling different roles on the same team.
          type: string
          example: UNAUTHORIZED
          enum:
            - UNAUTHORIZED
            - FIRST_MATCH
            - WEIGHTED
            - WEIGHTED_BY_TEAM
        noMappingsErrorRedirectUrl:
          description: |
            Redirect URL when NO_MAPPINGS_ERROR_REDIRECT is selected.
          type: string
          example: https://www.example.com
          maxLength: 2048
          nullable: true
      required:
        - noMappingStrategy
        - differentRolesSameTeamStrategy
    SsoSettingsBaseSchemaV1:
      type: object
      title: SSO Settings Base Schema V1
      properties:
        product:
          allOf:
            - $ref: '#/components/schemas/Product'
          description: The product to which SSO settings is applied to. SSO settings are configured per specific product.
        isActive:
          type: boolean
          description: Flag to indicate if the SSO settings is active.
          example: true
        createUserOnLogin:
          type: boolean
          description: Flag to indicate if the user will be created automatically if not found in the system.
          example: true
        isPasswordLoginEnabled:
          type: boolean
          description: 'Flag to indicate if the user will be able to login with password. Deprecated: use the API endpoint `/platform/v1/global-sso-settings` for this functionality. This is now a global setting: if this flag is defined here and this SSO setting is set to be active, the setting will be applied at global level.'
          example: true
          deprecated: true
        isSingleLogoutEnabled:
          type: boolean
          description: Flag to indicate if the single logout support is enabled.
          example: true
        isGroupMappingEnabled:
          type: boolean
          description: Flag to indicate if group mapping support is enabled.
          example: true
        groupMappingAttributeName:
          type: string
          description: The group mapping attribute name.
          example: groups
          maxLength: 64
          nullable: true
    SsoSettingsResponseBaseV1:
