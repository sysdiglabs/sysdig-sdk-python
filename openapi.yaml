            $ref: '#/components/schemas/ActionParameterMetadata'
          maxItems: 100
          description: the list of parameters that the action supports
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ActionOutputsMetadata'
          maxItems: 100
        description:
          type: string
          description: The description of the action.
          maxLength: 1024
          example: Kill a container
        isUndoable:
          type: boolean
          description: Whether the action is undoable.
          example: true
    Actions:
