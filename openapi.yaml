        - name: assetId
          in: query
          description: |
            The ID of the asset for which we want to retrieve the SBOM. It's the imageId for container-image and the hostId for hosts
            Provide this with assetType if not providing bomIdentifier
          schema:
            type: string
            example: sha256:6147d53c2a3a4d99b8343665430e5d420eb7ee65cb89995b6bea1af2595be53a
            maxLength: 512
        - name: assetType
          in: query
          description: The type of the asset for which we want to retrieve the SBOM. Provide this with assetId if not providing bomIdentifier
          schema:
            type: string
            enum:
              - container-image
              - host
        - name: bomIdentifier
          in: query
          description: The ID of a single SBOM. Either provide this or both assetId and assetType
          schema:
            type: string
            example: urn:uuid:6536eeee-b8f2-4865-b996-adc991c28202
            maxLength: 512
