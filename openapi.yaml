    MonitorEventsFrom:
      description: |
        From, expressed in Unix nanoseconds timestamp. The difference between `from` and `to`
        cannot be greater than 30 days. If defined, `cursor` cannot be used.
      type: integer
      format: int64
      minimum: 0
      example: 1546300800000000000
      maximum: 4133980799000000000
    MonitorEventsTo:
      description: |
        To, expressed in Unix nanoseconds timestamp. The difference between `from` and `to`
        cannot be greater than 30 days. If defined, `cursor` cannot be used.
      type: integer
      format: int64
      minimum: 0
      example: 1546300800000000000
      maximum: 4133980799000000000
    MonitorEventsCursor:
      description: |
        Cursor is a string used to retrieve paginated data. It acts as a pointer to a page of data. When a cursor is defined, the `from` and `to` parameters must not be used.
      type: string
      example: LTltNGUybXIwdWkzZThhMjE1bjRn
      maxLength: 512
    MonitorEventsFilter:
      description: |
        Query language expression for filtering results.
        The filter is the result of logical concatenations,
        using "and" and "or" binary operators and the "not" unary prefix operator (i.e. `pid = 1 and not ppid = 2`),
        of attribute comparisons. Attribute comparisons can be:
        - scalar, using `=`, `!=`
        - scalar for string values, using `starts with`, `contains`, operators
        - vector, using `in` to check the equality among one of the values provided between parenthesis (i.e. `pid in (1, 2)`)
        Depending on the attribute, only some operators can be available.
        Values containing double-quotes `"` need escaping using backslash `\`, i.e. name = "sample \"quoted\" value".
        Supported attributes are:
        * `id` - the event id, using `=`, `!=`, `starts with`, `contains`, `in`
        * `type` - the event type, using `=`, `!=`
        * `source` - the event source, using `=`, `!=`, `starts with`, `contains`
        * `severity` - the event severity, using `=`, `!=`, `in`
        * `labels.<scope label>` - the event scope label, using `=`, `!=`, `starts with`, `contains`, `in`
      type: string
      example: type = 'ALERT' and severity in (3,4,5) and labels.kube_cluster_name = 'my-cluster'
      maxLength: 2048
    MonitorEventsPage:
      type: object
      description: Pagination information.
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: |
            The number of events matching the search criteria. This number is always major or equal to the number of events returned.
          example: 10
          minimum: 0
          maximum: 9223372036854776000
        prev:
          type: string
          description: |
            `prev` is a string pointing to the previous page of data.
            Use this as the `cursor` to get the previous page of data.
          example: LTltNGUybXIwdWkzZThhMjE1bjRn
          maxLength: 512
        next:
          type: string
          description: "`next` is a string pointing to the next page of data.\nUse this as the `cursor` to scroll paginated results and get the next page of data. \nIf not included, the current response is the last page.\n"
          example: KzltNGUybXIwdWkzZThhMjE1bjRn
          maxLength: 512
