                publicationDate: '2024-01-22T08:51:46.00Z'
                links:
                  - https://sysdig.com/exploits/12345
              fixVersion: 1.2.3
              mainProvider: vulndb
              packageRef: 2772f8a6c73fa17
              riskAcceptRefs:
                - e6b4b0d3255bfef
              providersMetadata:
                nvd: {}
              cisaKev:
                publishDate: '2023-12-06'
                dueDate: '2023-10-31'
                knownRansomwareCampaignUse: 'false'
        layers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Layer'
