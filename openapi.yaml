components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Offset:
      name: offset
      in: query
      description: The offset number of items to start with
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 2147483647
        default: 0
        example: 30
    Limit:
      name: limit
      in: query
      description: The number of items to return
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
        example: 25
    PricingIdPath:
      name: pricingId
      in: path
      description: The pricing ID.
      required: true
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    InhibitionRulePath:
      name: inhibitionRuleId
      in: path
      description: The inhibition rule ID.
      required: true
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    JobNamePath:
      name: jobName
      in: path
      description: The custom Prometheus job name.
      required: true
      schema:
        type: string
        maxLength: 256
        minLength: 1
        example: my-custom-job
    Query:
      name: query
      in: query
      description: The Prometheus expression query string.
      required: true
      schema:
        type: string
        maxLength: 50000
        example: up
    Time:
      name: time
      in: query
      description: The evaluation timestamp as RFC3339 or a unix timestamp. If omitted, the current server time is used.
      required: false
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-21T14:30:00Z'
    Timeout:
      name: timeout
      in: query
      description: The evaluation timeout. The default is 2 minutes.
      required: false
      schema:
        $ref: '#/components/schemas/Duration'
    LimitQuery:
      name: limit
      in: query
      description: The maximum number of returned series. To disable the limit, set the value to 0.
      required: false
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    TimeStartQuery:
      name: start
      in: query
      description: The inclusive start timestamp of the query range as RFC3339 or a unix timestamp.
      required: true
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-21T14:30:00Z'
    TimeEndQuery:
      name: end
      in: query
      description: The inclusive end timestamp of the query range as RFC3339 or a unix timestamp.
      required: true
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-30T14:30:00Z'
    Step:
      name: step
      in: query
      description: The query resolution step width, specified as a duration or a floating-point number of seconds.
      required: true
      schema:
        oneOf:
          - $ref: '#/components/schemas/Duration'
          - $ref: '#/components/schemas/UnlimitedLong'
    MatchSeries:
      name: match[]
      in: query
      description: A repeated series selector argument that specifies the series to return. You must provide at least one match[] parameter.
      required: true
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      style: form
      explode: true
      example:
        - up
        - process_start_time_seconds{job="prometheus"}
    TimeStartSeries:
      name: start
      in: query
      description: The inclusive start timestamp of the series query as RFC3339 or a unix timestamp.
      required: false
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-21T14:30:00Z'
    TimeEndSeries:
      name: end
      in: query
      description: The inclusive end timestamp of the series query as RFC3339 or a unix timestamp.
      required: false
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-30T14:30:00Z'
    LimitSeries:
      name: limit
      in: query
      description: The maximum number of returned series. The limit is capped at 10,000. To disable the limit, set the value to 0.
      required: false
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    TimeStartUnsupported:
      name: start
      in: query
      description: <b>UNSUPPORTED</b> - This parameter is not supported due to the Sysdig's specific implementation.
      required: false
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-21T14:30:00Z'
    TimeEndUnsupported:
      name: end
      in: query
      description: <b>UNSUPPORTED</b> - Sysdig does not support this parameter.
      required: false
      schema:
        $ref: '#/components/schemas/QueryTime'
      example: '2023-03-30T14:30:00Z'
    MatchLabelNames:
      name: match[]
      in: query
      description: A repeated series selector argument that specifies the series from which to read the label names.
      required: false
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
      style: form
      explode: true
      example:
        - '{job="prometheus"}'
    LabelNamePath:
      name: labelName
      in: path
      required: true
      description: The name of the label to retrieve values for.
      schema:
        type: string
        maxLength: 10000
      example: job
    MatchLabelValues:
      name: match[]
      in: query
