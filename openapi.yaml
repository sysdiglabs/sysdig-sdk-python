                - type: imageName
                  value: nginx:latest
              status: active
              reason: RiskMitigated
              description: description
              expirationDate: '2021-07-01'
              createdAt: '2024-01-22T08:51:46.016464Z'
              updatedAt: '2024-01-22T08:51:46.016464Z'
        producer:
          $ref: '#/components/schemas/Producer'
      additionalProperties: false
      type: object
      required:
        - assetType
        - stage
        - metadata
        - packages
    EntityDefinition:
      type: object
      description: Defines the structure and metadata of a field in the query result.
      properties:
        type:
          type: string
          description: Type of the entity.
          maxLength: 128
          example: Field
        alias:
          type: string
          description: The alias used in the query.
          maxLength: 128
          example: name
        definition:
          type: object
          description: Detailed definition of the field.
          properties:
            def_type:
              type: string
              description: Type of the definition.
              enum:
                - Entity
                - Field
                - Function
                - Query
                - Relationship
                - Union
              example: Field
            name:
              type: string
              description: Name of the field.
              maxLength: 128
              example: name
            type:
              type: string
              description: Data type of the field.
              enum:
                - String
                - BigInt
                - Integer
                - DateTime
                - Float
                - Boolean
                - Enum
                - List
              example: String
            hidden:
              type: boolean
              description: Indicates if the field is hidden from view.
              example: false
          required:
            - def_type
            - name
            - type
      required:
        - type
        - definition
    QuerySummary:
      type: object
      description: Summary of query execution metrics and timing information.
      properties:
        available_after:
          type: integer
          format: int64
          description: Time taken for results to become available in milliseconds.
          example: 23
        consumed_after:
          type: integer
          format: int64
          description: Time taken to consume results in milliseconds.
          example: 100
        total_time:
          type: integer
          format: int64
          description: Total query execution time in milliseconds.
          example: 25
      required:
        - available_after
        - consumed_after
        - total_time
    QueryResponse:
      type: object
      description: Response object containing query results and metadata.
      properties:
        entities:
          type: object
          description: Metadata about the returned fields.
          additionalProperties: true
          properties:
            fields:
              $ref: '#/components/schemas/EntityDefinition'
        items:
          type: array
          description: Array of query results based on the query fields.
          maxItems: 1000
          items:
            type: object
            description: Dynamic object containing queried fields.
            additionalProperties: true
            example:
              name: CVE-2024-45491
              cvssScore: 7.5
              severity: Medium
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Unique identifier for the query execution.
          example: 4b1d2442-739a-4957-bf27-20b563e46c3a
        summary:
          $ref: '#/components/schemas/QuerySummary'
      required:
        - entities
        - items
        - id
        - summary
    PoliciesPage:
      type: object
      description: |
        Page details, providing both returned and total count of matched elements.
      required:
        - returned
        - matched
      properties:
        returned:
          type: integer
          format: int32
          description: |
            The number returned elements: always less or equal the limit specified in the request.
          example: 1
          minimum: 0
          maximum: 1000
        matched:
          type: integer
          format: int64
          description: |
            Total count of elements matched the provided filter.
          example: 10
          minimum: 0
          maximum: 2147483647
        next:
          description: Cursor used to retrieve the next page of results.
          type: string
          maxLength: 1024
          example: MA==
          nullable: true
    PolicySummary:
      title: Policy summary definition
      type: object
      description: Policy summary definition.
      required:
        - id
        - name
        - identifier
        - stages
      properties:
        id:
          type: integer
          format: int64
          description: The Policy ID
          minimum: 0
          maximum: 9223372036854776000
          example: 1
        name:
