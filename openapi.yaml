    PricingProjectedResponseV1:
      type: object
      title: Pricing Projected Response V1
      description: The monthly projected cost for a specific cluster.
      properties:
        clusterName:
          description: The name of the cluster.
          type: string
          maxLength: 256
          example: My pricing
        monthlyProjectedCost:
          description: Monthly projected cost.
          type: number
          example: 113114.72
    GetPricingProjectedPaginatedResponseV1:
      title: Get Paginated Pricing Projected Response V1
      allOf:
        - $ref: '#/components/schemas/OffsetPaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PricingProjectedResponseV1'
              maxItems: 200
    PrometheusLabel:
      title: PrometheusLabel
      type: string
      description: A valid Prometheus label name. Must match ^[a-zA-Z_][a-zA-Z0-9_]*$
      minLength: 1
      maxLength: 1024
      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
      example: kube_cluster_name
    PromqlMatcher:
      title: PromQL Matcher
      type: object
      description: |
        A PromQL-style filter that narrows the dataset to resources
        matching specific labels. If not provided, no additional filtering
        is applied.
      required:
        - label
        - operator
        - value
      properties:
        label:
          $ref: '#/components/schemas/PrometheusLabel'
        operator:
          type: string
          enum:
            - EQUAL
            - NOT_EQUAL
            - REGEX_MATCH
            - REGEX_NOT_MATCH
          description: |
            The operator to use in the filter:
              - `EQUAL` (`=`): Exact match
              - `NOT_EQUAL` (`!=`): Exclude exact match
              - `REGEX_MATCH` (`=~`): Regular expression match
              - `REGEX_NOT_MATCH` (`!~`): Regular expression mismatch
          example: REGEX_MATCH
        value:
          type: string
          description: The value to match against.
          example: my_service.*
          minLength: 1
          maxLength: 1024
    WorkloadCostTrendsDataRequest:
      title: Workload Cost Trends Data Request
      required:
        - trendRangeInDays
        - date
      properties:
        trendRangeInDays:
          description: |
            Specifies the number of days used to calculate and extract cost data.
            Must be a positive integer.
          type: number
          minimum: 1
          maximum: 30
          example: 10
        date:
          description: "The reference date used to define the time window for cost trend calculation.\nWhen combined with `trendRangeInDays`, this date represents the inclusive upper bound\nof the time range — the trend is calculated from (`date - trendRangeInDays`).\nFor example, if `date` is 2025-02-12 and `trendRangeInDays` is 10, the time range\nused for calculation is from 2025-02-03 to 2025-02-12 (inclusive). \nMust be in YYYY-MM-DD format.\n"
          type: string
          format: date
          example: '2025-02-12'
        scope:
          description: A list of PromQL-style filters
          type: array
          items:
            $ref: '#/components/schemas/PromqlMatcher'
          maxItems: 512
        groupBy:
          type: array
          items:
            $ref: '#/components/schemas/PrometheusLabel'
          maxItems: 10
    DateRange:
      title: DateRange
      type: object
      description: A date range with inclusive start and end dates.
      required:
        - startDate
        - endDate
      properties:
        startDate:
          description: The beginning of the date range.
          type: string
          format: date
          example: '2025-02-17'
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd")'
        endDate:
          description: The end of the date range.
          type: string
          format: date
          example: '2025-02-19'
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd")'
    WorkloadCostTrendsDataResponse:
      type: object
      title: Workload Cost Trends Data Response
      description: Cost trends observed between two consecutive time periods in the past.
      properties:
        currentRange:
          allOf:
            - description: |
                The date range for the current cost data.
                It represents the most recent time window used for cost calculation.
                This range starts `trendRangeInDays` days before the requested `date`,
                and ends on the `date`. Both `startDate` and `endDate` are inclusive.
                For example, if `date` is 2025-02-12 and `trendRangeInDays` is 10,
                the current range will be from 2025-02-03 to 2025-02-12.
            - $ref: '#/components/schemas/DateRange'
        previousRange:
          allOf:
            - description: |
                The date range for the previous cost data used for comparison.
                This range immediately precedes the current range, with the same duration.
                It ends one day before `currentRange.startDate`, and both `startDate`
                and `endDate` are inclusive.
                For example, if the current range is from 2025-02-03 to 2025-02-12,
                the previous range will be from 2025-01-24 to 2025-02-02.
            - $ref: '#/components/schemas/DateRange'
        total:
          description: Aggregated cost values for the current and previous ranges.
          type: object
          properties:
            current:
              description: The total cost for the current range.
              type: number
              format: double
              example: 33.754530610617486
            previous:
              description: The total cost for the previous range.
              type: number
              format: double
              example: 34.36367482352418
            change:
              description: The difference between the current and the previous cost periods expressed in percentages.
              type: number
              format: double
              example: -1.77
        groupByData:
          type: array
          description: Grouped cost data for each combination of label values.
          items:
            type: object
            properties:
              group:
                description: Key-value pairs representing the grouping labels.
                type: object
                additionalProperties:
                  type: string
                  example: kube_cluster_name:test-k8s-cluster
                  maxLength: 1024
              current:
                description: The cost for the current range within this group.
                type: number
                format: double
                example: 33.754530610617486
              previous:
                description: The cost for the previous range within this group.
                type: number
                format: double
                example: 34.36367482352418
              change:
                description: The difference in cost between current and previous ranges for this group.
                type: number
                format: double
                example: -0.6091442129
          maxItems: 10000
    WastedWorkloadDataRequest:
      title: Wasted Workload Spend Data Request
      required:
        - dateRange
      properties:
        dateRange:
          allOf:
            - description: |
                The date range used to calculate the Wasted Workload Spend report. Both `startDate` and `endDate` are inclusive.
            - $ref: '#/components/schemas/DateRange'
        scope:
          description: A list of PromQL-style filters
          type: array
          items:
            $ref: '#/components/schemas/PromqlMatcher'
          maxItems: 512
        groupBy:
          description: |
            Specifies Prometheus labels to group the report data by.
            By default, the following labels will always be included:
              - kube_cluster_name
              - kube_namespace_name
              - kube_workload_name
            A maximum of 7 additional custom labels can be specified.
          type: array
          items:
            $ref: '#/components/schemas/PrometheusLabel'
          maxItems: 7
    WastedWorkloadSpendDataResponse:
      type: object
      title: Wasted Workload Spend Data Response
      description: Aggregated and grouped cost data representing Wasted Workload Spend over a specific date range.
      properties:
        total:
          type: object
          description: Aggregated cost values for the specified time range.
          properties:
            accrued:
              type: number
              format: double
              description: Total cost accrued during the reporting period.
              example: 31.59
            estimated:
              type: number
              format: double
              description: Estimated efficient cost during the reporting period.
              example: 5.6
            wasted:
              type: number
              format: double
              description: Difference between accrued and estimated cost.
              example: 25.73
        groupByData:
          type: array
          description: Grouped cost data for each combination of Prometheus label values.
          items:
            type: object
            example:
              group:
                kube_cluster_name: test-k8s-cluster
              accrued: 26.59
              estimated: 3.6
              wasted: 22.99
            properties:
              group:
                type: object
                description: Key-value pairs representing grouping labels.
                additionalProperties:
                  type: string
                  example: kube_cluster_name:test-k8s-cluster
                  maxLength: 1024
              accrued:
                type: number
                format: double
                description: Accrued cost for this group.
                example: 26.59
              estimated:
                type: number
                format: double
                description: Estimated cost for this group.
                example: 3.6
              wasted:
                type: number
                format: double
                description: Wasted cost for this group.
                example: 22.99
          maxItems: 10000
    WorkloadRightsizingDataRequest:
      title: Workload Rightsizing Data Request
      required:
        - dateRange
        - algorithm
      properties:
        dateRange:
          allOf:
            - description: |
                The date range used to calculate the Workload Rightsizing report. Both `startDate` and `endDate` are inclusive.
            - $ref: '#/components/schemas/DateRange'
        algorithm:
          description: "Aggregation algorithm used for rightsizing analysis. Currently supported values are:\n- AVG \n- P95 \n- MAX\nThis field is case-sensitive and may support more values in the future.\n"
          type: string
          maxLength: 64
        scope:
          description: A list of PromQL-style filters
          type: array
          items:
            $ref: '#/components/schemas/PromqlMatcher'
          maxItems: 512
    WorkloadRightsizingDataResponse:
      type: object
      title: Workload Rightsizing Data Response
      description: Cost data representing Workload Rightsizing over a specific date range.
      properties:
        groupByData:
          type: array
          description: Grouped workload rightsizing data by cluster, namespace, workload, and container.
          items:
            type: object
            properties:
              group:
                type: object
                description: |
                  Key-value pairs representing the logical grouping keys.

                  The data is grouped by the following dimensions:
                  - cluster
                  - namespace
                  - workload
                  - container
                example:
                  cluster: test-cluster
                  namespace: prod
                  workload: web-api
                  container: web-api-container
                additionalProperties:
                  type: string
                  example: cluster:test-cluster
                  maxLength: 1024
              suggestedCpu:
                type: number
                format: double
                description: Suggested CPU allocation (in milicores).
                example: 100
              suggestedMemory:
                type: number
                format: double
                description: Suggested memory allocation (in MiB).
                example: 1024
              monthlyCost:
                type: number
                format: double
                description: Estimated current monthly cost in USD.
                example: 10.02
              monthlyPotentialSavings:
                type: number
                format: double
                description: Estimated potential monthly savings in USD.
                example: 2
              workloadType:
                type: string
                example: Deployment
                description: |
                  Type of Kubernetes workload.
                  Possible values include:
                  - Deployment
                  - StatefulSet
                  - DaemonSet
                  - Job
                  - CronJob
                  - ReplicaSet
                  - ReplicationController
                maxLength: 64
              numberOfPods:
                type: integer
                format: int32
                description: Number of pods currently running in the workload.
                example: 1
                minimum: 0
                maximum: 2147483647
              requestedCpu:
                type: number
                format: double
                description: CPU requested by the container (in milicores).
                example: 120
              requestedMemory:
                type: number
                format: double
                description: Memory requested by the container (in MiB).
                example: 2048
          maxItems: 10000
    LabelMatcherV1:
      type: object
      title: Label matcher v1
      description: Matcher to match alerts to inhibition rules.
      required:
        - labelName
        - operator
        - value
      properties:
        labelName:
          type: string
          description: Label to match.
          minLength: 1
          maxLength: 1024
          example: myLabel
        operator:
          type: string
          description: Match operator.
          enum:
            - EQUALS
            - NOT_EQUALS
            - REGEXP_MATCHES
            - NOT_REGEXP_MATCHES
          example: EQUALS
        value:
          type: string
          description: Label value to match in case operator is of type equality, or regular expression in case of operator is of type regex.
          minLength: 0
          maxLength: 1024
          example: regexExample[s]?
    InhibitionRuleResponseV1:
