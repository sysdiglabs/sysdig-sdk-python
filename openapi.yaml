          $ref: '#/components/schemas/UnlimitedLong'
        isEnabled:
          description: Indicates if the access key is enabled
          type: boolean
          example: true
        accessKey:
          description: Displays the access key value
          type: string
          maxLength: 256
          example: f97af7c5-dac3-49b1-b5e0-710871d34a15
        dateCreated:
          description: |
            Date and time when access key was created
          type: string
          format: date-time
          nullable: true
          example: '2022-01-31T22:15:28Z'
          maxLength: 64
        dateDisabled:
          description: |
            Date and time when access key was disabled
          type: string
          format: date-time
          nullable: true
          example: '2022-01-31T22:15:28Z'
          maxLength: 64
        agentLimit:
          description: Maximum number of agents that can be connected with the access key
          type: integer
          nullable: true
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 100
        agentReservation:
          description: Number of agents that are guaranteed to be available for the access key
          type: integer
          nullable: true
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 5
        teamId:
          description: ID of team that owns the access key
          type: integer
          nullable: true
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 13
        metadata:
          description: Access key metadata (maximum of 20 key-value pairs where key can be up to 25 characters long and value can be up to 50 characters long)
          maxItems: 20
          type: object
          additionalProperties:
            type: string
            maxLength: 76
