  /prometheus/api/v1/rules:
    get:
      summary: Rules
      description: "The /rules API endpoint returns the list of alerting rules. It also returns the currently active alerts fired by the Prometheus instance of each alerting rule. \n\\\nSysdig currently does not support recording rules.\n\\\n**Required permissions:** _alerts.read_\n"
      operationId: getRulesV1
      tags:
        - Prometheus
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - alert
          description: This endpoint only returns alerting rules (`type=alert`). When absent or empty, only alerting rules are returned.
        - name: rule_name[]
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          style: form
          explode: true
          description: Only return rules with the given rule name. If repeated, rules with any of the provided names are returned.
        - name: rule_group[]
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          style: form
          explode: true
          description: Only return rules with the given rule group name. If repeated, rules with any of the provided group names are returned.
        - name: file[]
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          style: form
          explode: true
          description: <b>UNSUPPORTED</b> - Sysdig does not support this parameter.
        - name: exclude_alerts
          in: query
          required: false
          schema:
            type: boolean
          description: This endpoint supports only returning alerting rules (`exclude_alerts=true`).
        - name: match[]
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 512
          style: form
          explode: true
          description: Only return rules with configured labels that satisfy the label selectors.
        - name: group_limit
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UnlimitedLong'
          description: Limit the number of rule groups returned in a single response.
        - name: group_next_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: <b>UNSUPPORTED</b> - This parameter is not supported due to the Sysdig's specific implementation.
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              description: Maximum number of allowed requests per minute.
              schema:
                type: integer
                format: int32
                minimum: 1
                maximum: 4096
          description: List of rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponseV1'
        '400':
          $ref: '#/components/responses/BadRequestPrometheus'
        '401':
          $ref: '#/components/responses/UnauthorizedPrometheus'
        '404':
          $ref: '#/components/responses/NotFoundPrometheus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
