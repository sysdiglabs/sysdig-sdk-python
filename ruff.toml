# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 130
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
preview = true
select = [
    "E9",
    "F63",
    "F7",
    "F82",

    "E101", # mixed-spaces-and-tabs
    "E701", # multiple-statements-on-one-line-colon
    "E702", # multiple-statements-on-one-line-semicolon
    "E703", # useless-semicolon
    "E711", # none-comparison
    "E712", # true-false-comparison
    "E721", # type-comparison
    "E722", # bare-except
    "E731", # lambda-assignment
    "E741", # ambiguous-variable-name
    "E742", # ambiguous-class-name
    "E743", # ambiguous-function-name
    "E902", # io-error

    "N804", # invalid-first-argument-name-for-class-method
    "N807", # dunder-function-name
    "N801",
    "N802", # Function names should be lowercase
    "N803",
    "N805",
    "N818",
    "N999",

    "PT010", # pytest-raises-without-exception
    "PT024", # pytest-unnecessary-asyncio-mark-on-fixture
    "PT025", # pytest-erroneous-use-fixtures-on-fixture
    "PT026", # pytest-use-fixtures-without-parameters

    "RUF006", # asyncio-dangling-task
    "RUF007", # pairwise-over-zipped
    "RUF008", # mutable-dataclass-default
    "RUF009", # function-call-in-dataclass-default-argument

    "UP021", # replace-universal-newlines
    "UP029", # unnecessary-builtin-import

    "TID252", # relative-imports

    # Doc Lint
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC403",
    "DOC501",
    "DOC502"
]

ignore = [
    "DOC201", # `return` is not documented in docstring
    "N803", # invalid-argument-name
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
