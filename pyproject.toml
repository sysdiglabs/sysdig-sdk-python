[project]
name = "sysdig-sdk-python"
version = "0.19.1" # Updated by poetry-dynamic-versioning
description = "Python client for Sysdig Platform"
authors = [
  {name = "Sysdig Inc.", email = "info@sysdig.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "urllib3 >= 2.1.0, < 3.0.0",
  "python-dateutil >= 2.8.2",
  "pydantic >= 2",
  "typing-extensions >= 4.7.1",
  "python_dateutil >= 2.5.3"
]

[dependency-groups]
dev = [
  "pytest >= 7.2.1",
  "pytest-cov >= 2.8.1",
  "tox >= 3.9.0",
  "flake8 >= 4.0.0",
  "types-python-dateutil >= 2.8.19.14",
  "mypy >= 1.5",
  "mamba == 0.11.3",
  "expects == 0.9.0",
  "PyYAML == 6.0.2",
  "requests-toolbelt == 1.0.0",
  "TatSu == 5.8.3",
  "requests == 2.32.4"
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs" # Will get the latest git tag to configure this project's version

[tool.hatch.build.targets.wheel]
packages = ["sysdig_client"]
