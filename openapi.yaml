  /api/sysql/v2/query:
    x-excluded-environments:
      - OnPrem
    get:
      deprecated: true
      tags:
        - SysQL
      summary: Execute SysQL query via GET
      description: |
        [DEPRECATED] Retrieve resources from the graph datastore using the GET method.

        > The GET method for this endpoint is deprecated and will be removed in future versions.
        > Please use the POST method instead, which provides better support for complex queries.
      operationId: querySysqlGet
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: true
          description: The SysQL statement.
          example: MATCH IAMUser AS a WHERE a.customerId = 1234567890 RETURN a.name AS name, a.arn AS arn;
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 1000
            description: "The limit parameter defines the maximum number of items returned in the result set, specifically within \nthe items array in the response.\n\nThis parameter is optional. The recommended approach is to define the limit directly in the SysQL statement \nusing the LIMIT clause. If specified in the request URL, it will override the limit set in the statement. \nIf not specified, a default limit of 50 will be applied.\n"
            title: Pagination Limit
            example: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
            maximum: 10000
            description: "The offset parameter specifies how many result set objects to skip in a MATCH statement. Use it when you \nwant to ignore the first few items in the result set.\n\nThis parameter is optional. The recommended approach is to set the offset directly in the SysQL statement \nusing the OFFSET clause. If specified in the request URL, it will override the offset in the statement. \nIf not specified, a default offset of 0 will be applied.\n\nUse limit and offset together in SysQL to paginate results, splitting them into pages with a defined number \nof items for display.\n"
            title: Pagination Offset
            example: 0
        - in: query
          name: deterministic_order
          required: false
          schema:
            type: boolean
            default: false
            description: "The deterministic_order parameter controls whether consistent ordering is enforced in the result set. \nOrdering is implicitly applied when pagination options, such as limit and offset, are specified in the \nrequest. This is an optional parameter.\n"
            title: Deterministic Order Control
            example: true
      responses:
        '200':
          description: |
