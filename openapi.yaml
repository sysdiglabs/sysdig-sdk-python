    PermissionsFilter:
      name: filter
      description: |
        Filter by products when getting permissions for custom roles.\
        Avaliable products are: SDS, SDC.\
        You can specify a single product or a list of products separated by commas.\
        Product names are case-sensitive.\
        If not specified, all permissions are returned.
      in: query
      required: false
      schema:
        type: string
        maxLength: 8192
        default: ''
        example: products:SDS
    RoleIdPath:
      name: roleId
      in: path
      description: The role id.
      required: true
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    ServiceAccountIdPath:
      name: serviceAccountId
      in: path
      description: The service account ID.
      required: true
      schema:
        $ref: '#/components/schemas/UnlimitedLong'
    PathCertificateId:
      name: certId
      in: path
      description: ID of the certificate
      required: true
      schema:
        type: string
        maxLength: 20
    EventId:
      name: eventId
      description: The event id.
      required: true
      in: path
      schema:
        type: string
        example: 179854fbe16a1279f2ebeb558f1ebe99
        maxLength: 32
    IntegrationId:
      name: integrationId
      in: path
      description: ID of the integration to return
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854776000
    vulnerabilityCursor:
      name: cursor
      in: query
      required: false
      description: Cursor is a string used to retrieve a particular page of data. It is an opaque structure, and should not be mangled. It could be retrieved in the body of each request. If a response does not contain a cursor, it means that it's the last page.
      schema:
        type: string
        maxLength: 300
        example: MTI0MjM0Cg==
    ActionExecutionId:
      name: actionExecutionId
      in: path
      description: ID of the action execution
      required: true
      schema:
        type: string
        maxLength: 64
        example: '1234567890123456789012345678901234567890123456789012345678901234'
    vulnerabilityFilter:
      name: filter
      in: query
      description: The filtering string in secure-querylang syntax.
      required: false
      schema:
        type: string
        maxLength: 200
        example: freeText in ("postgres") and status = "expired"
    order:
      name: order
      in: query
      description: The sorting order
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
        example: asc
    acceptedRiskID:
      name: acceptedRiskID
      in: path
      description: The Accepted Risk ID
      required: true
      schema:
        type: string
        maxLength: 32
        example: 17af8bade67c9a208e632df001fcea2c
    MultiOrderBy:
      name: orderby
      in: query
      description: |
        Ordering to apply in the form of `field:direction` where `direction` can either be `asc` or `desc`.\
        Multiple orderings can be applied by repeating the `orderby` parameter:\
        `&orderby=key1:direction1&orderby=key2:direction2`
      required: false
      style: form
      schema:
        type: array
        maxItems: 4
        default:
          - id:desc
        items:
          type: string
          maxLength: 256
          example: name:desc
  schemas:
    PricingType:
      title: Pricing type
