        description:
          type: string
          description: policy description
          minLength: 0
          maxLength: 1024
          example: Sysdig policy
        stages:
          type: array
          minItems: 0
          maxItems: 3
          description: |
            array of stages for the policy.
            An empty array means the policy is applied only when specifically requested by its identifier.
            It may be one of the following:
              - runtime
              - pipeline
              - registry
          items:
            type: string
            example: runtime
            minLength: 0
            maxLength: 1024
