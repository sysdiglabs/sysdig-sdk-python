    PoliciesSummaryEntry:
      type: object
      description: A Policy summary that indicates whether a policy failed or passed.
      required:
        - id
        - name
        - isPassed
      properties:
        id:
          type: integer
          description: Policy Id
          example: 2
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        name:
          type: string
          description: Policy Name
          example: Sysdig Kubernetes
          maxLength: 256
        isPassed:
          type: boolean
          description: True for passed, false for failed
          example: false
    PosturePolicySummary:
      type: object
      description: The posture policy summary
      required:
        - passPercentage
        - policies
      properties:
        passPercentage:
          type: integer
          description: Percentage of policies passing
          format: int32
          example: 0
          minimum: 0
          maximum: 100
        policies:
          type: array
          description: The policies list
          items:
            $ref: '#/components/schemas/PoliciesSummaryEntry'
          maxItems: 10000
    VulnerabilitySummary:
      required:
        - criticalSeverityCount
        - highSeverityCount
        - mediumSeverityCount
        - lowSeverityCount
        - negligibleSeverityCount
        - hasExploit
      properties:
        criticalSeverityCount:
          format: int32
          type: integer
          example: 1
          minimum: 0
          maximum: 2147483647
          description: Number of critical severity vulnerabilities
        highSeverityCount:
          format: int32
          type: integer
          example: 2
          minimum: 0
          maximum: 2147483647
          description: Number of high severity vulnerabilities
        mediumSeverityCount:
          format: int32
          type: integer
          example: 3
          minimum: 0
          maximum: 2147483647
          description: Number of medium severity vulnerabilities
        lowSeverityCount:
          format: int32
          type: integer
          example: 4
          minimum: 0
          maximum: 2147483647
          description: Number of low severity vulnerabilities
        negligibleSeverityCount:
          format: int32
          type: integer
          example: 5
          minimum: 0
          maximum: 2147483647
          description: Number of negligible severity vulnerabilities
        hasExploit:
          type: boolean
          example: true
          description: Indicates if a resource has an exploit
      type: object
      description: Vulnerability summary of a resource
    InventoryZone:
      type: object
      description: a Zone
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: The zone identifier
          example: 1
          format: int64
          minimum: 1
          maximum: 9223372036854776000
        name:
          type: string
          description: The zone name
          example: Entire Infrastructure
          maxLength: 256
    ContainerInfo:
      required:
        - podName
        - containerId
        - containerName
      description: Kubernetes container information.
      properties:
        podName:
          type: string
          description: Pod name
          example: nginx
          maxLength: 63
        containerId:
          type: string
          description: Container id.
          example: 1b883a5d-06c7-4e90-9973-d42d9889de27
          maxLength: 64
        containerName:
          type: string
          description: Container name.
          example: my-app
          maxLength: 253
        pullString:
          type: string
          description: Pull string for image used for the container.
          example: redis/redis:1.0.0
          maxLength: 1024
    InventoryResource:
      required:
        - hash
        - name
        - platform
        - type
        - category
        - lastSeen
        - labels
        - metadata
        - resourceOrigin
        - zones
      description: An Inventory Resource
      properties:
        hash:
          type: string
          description: Resource unique identifier
          example: 62e348b71acd7be14a4bdfcc
          maxLength: 64
        name:
          type: string
          description: Resource name
          example: kube-proxy
          maxLength: 8192
        platform:
          type: string
          description: The resource platform (such as AWS, GCP, Kubernetes, or Azure)
          example: Kubernetes
          maxLength: 256
        type:
          type: string
          description: The resource type
          example: DaemonSet
          maxLength: 256
        category:
          type: string
          example: Compute
          description: The resource category
          maxLength: 256
        lastSeen:
          type: integer
          description: Last scan date as unix timestamp
          example: 1660742138
          format: int64
          minimum: 0
          maximum: 9223372036854776000
        isExposed:
          type: boolean
          description: Indicates if a resource is exposed to the internet
          example: true
        validatedExposure:
          type: boolean
          description: Indicates if a resource which is exposed to the internet could be reach by our network exposure validator
          example: true
        labels:
          type: array
          items:
            type: string
            example: env:Prod
            maxLength: 8192
          description: The resource labels
          maxItems: 10000
        metadata:
          type: object
          description: The resource metadata
          example:
            cluster: risks-aws-eks-liverisks
            containerNames:
              - kube-proxy
            distribution: EKS
            distributionVersion: '1.29'
            imagesCount: '1'
            namespace: kube-system
            pullStrings:
              - 602401143452.dkr.ecr.us-east-1.amazonaws.com/eks/kube-proxy:v1.29.0-minimal-eksbuild.1
        resourceOrigin:
          type: string
          description: Where a resource was collected (Code, Deployed)
          example: Deployed
          maxLength: 256
        posturePolicySummary:
          $ref: '#/components/schemas/PosturePolicySummary'
        vulnerabilitySummary:
          $ref: '#/components/schemas/VulnerabilitySummary'
        inUseVulnerabilitySummary:
          $ref: '#/components/schemas/VulnerabilitySummary'
        zones:
          type: array
          description: Resource zones
          items:
            $ref: '#/components/schemas/InventoryZone'
          maxItems: 10000
        configApiEndpoint:
          type: string
          example: /api/cspm/v1/kube/resource?resourceHash=62e348b71acd7be14a4bdfcc&resourceKind=DaemonSet
          maxLength: 512
          description: A link that provides the resource configuration.
        postureControlSummaryApiEndpoint:
          type: string
          description: A link that provides the posture control summary.
          example: /api/cspm/v1/kube/resource?fields=posturecontrolsummary%2Chash%2Cname%2Cplatform%2Ctype%2Cmetadata%2Cresourceorigin%2Ccategory%2Clastseen&resourceHash=62e348b71acd7be14a4bdfcc&resourceKind=DaemonSet
          maxLength: 512
        vmApiEndpoint:
          type: string
          description: A link that provides vulnerability management information about an image (Images only).
          example: /api/scanning/runtime/v2/workflows/results?cursor&filter=freeText%20in%20%28%222cfced35cf83d6cdcdcd2f4ac103ab620976cb507be8779a53224d31d2a1f227%22%29&limit=100&order=desc&sort=runningVulnsBySev&zones
          maxLength: 512
        containerInfo:
          type: array
          description: List of containers (with some of kubernetes metadata) belonging to this kubernetes workload. If resource is not kubernetes workload this fild will be empty.
          items:
            $ref: '#/components/schemas/ContainerInfo'
          maxItems: 10000
      type: object
    InventoryPage:
      description: The total number of pages the matched the filter, and the next and previous page numbers.
      required:
